<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#080c10">
    <meta name="color-scheme" content="dark">
    <meta http-equiv="Permissions-Policy" content="microphone=(self), camera=(self)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>QR Talk</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="styles.css">
    <script defer src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div>
          <h1>QR Talk</h1>
        </div>
      </header>

      <main>
        <section class="view is-active" id="homeView" aria-labelledby="homeTitle">
          <div class="home-copy">
            <h2 id="homeTitle">近くの端末と手軽にトーク</h2>
            <p>Bluetoothマイク・スピーカーは端末側で接続してから開始してください。</p>
          </div>

          <div class="primary-actions">
            <button class="action-button action-button-primary" id="startTalkButton" type="button">
              トークを開始
            </button>
            <button class="action-button action-button-secondary" id="joinTalkButton" type="button">
              トークに参加
            </button>
          </div>
        </section>

        <section class="view" id="directJoinView" aria-labelledby="directJoinTitle">
          <div class="home-copy">
            <h2 id="directJoinTitle">トークに参加</h2>
            <p>QRコードから開いたルームに入ります。</p>
          </div>

          <div class="primary-actions">
            <button class="action-button action-button-primary" id="directJoinButton" type="button">
              このトークに参加
            </button>
            <button class="action-button action-button-secondary" id="directBackButton" type="button">
              戻る
            </button>
          </div>
        </section>

        <section class="view" id="scannerView" aria-labelledby="scannerTitle">
          <div class="scanner-header">
            <div>
              <h2 id="scannerTitle">QRコードを読み取り</h2>
              <p id="scannerStatus">カメラを起動しています。</p>
            </div>
            <button class="small-button" id="cancelScanButton" type="button">戻る</button>
          </div>

          <div class="scanner-frame">
            <video id="scannerVideo" muted playsinline></video>
            <canvas id="scannerCanvas" hidden></canvas>
            <div class="scan-guide" aria-hidden="true"></div>
          </div>
        </section>

        <section class="view" id="roomView" aria-labelledby="roomTitle">
          <div class="room-topline">
            <div>
              <h2 id="roomTitle">接続準備中</h2>
            </div>
          </div>

          <div class="room-layout">
            <div class="qr-section">
              <canvas id="roomQrCanvas" width="232" height="232" aria-label="参加用QRコード"></canvas>
              <p id="roomUrlText" class="room-url"></p>
              <button class="small-button" id="copyLinkButton" type="button">リンクをコピー</button>
            </div>

              <div class="room-controls">
                <div class="control-grid">
                <button class="control-button mute-button" id="muteButton" type="button" aria-pressed="false">
                  <span class="mute-icon" aria-hidden="true">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
                      <path d="M12 15c1.8 0 3-1.3 3-3.1V5c0-1.8-1.2-3-3-3S9 3.2 9 5v6.9c0 1.8 1.2 3.1 3 3.1z"></path>
                      <path d="M6 10.8c0 3.3 2.4 5.7 6 5.7s6-2.4 6-5.7"></path>
                      <path d="M12 16.5V21"></path>
                      <path d="M8.5 21h7"></path>
                      <path class="mute-slash" d="M4 4l16 16"></path>
                    </svg>
                  </span>
                  <span id="muteButtonText">ミュート OFF</span>
                </button>
                <button class="control-button" id="pocketLockButton" type="button">ポケットロック</button>
                  <button class="control-button control-button-danger" id="leaveButton" type="button">退出</button>
                </div>

                <div class="device-panel">
                  <label for="audioInputSelect">マイク</label>
                  <select id="audioInputSelect"></select>
                <label for="audioOutputSelect">スピーカー</label>
                <select id="audioOutputSelect"></select>
              </div>

              <button class="small-button hidden" id="audioUnlockButton" type="button">
                音声を再生
              </button>

              <div class="participants">
                <div class="participants-heading">参加者</div>
                <ul id="participantsList"></ul>
              </div>
            </div>
          </div>

          <div id="remoteAudioMount" class="remote-audio" aria-hidden="true"></div>
        </section>
      </main>
    </div>

    <div class="pocket-overlay hidden" id="pocketOverlay" aria-live="polite">
      <div>
        <p>ポケットロック中</p>
        <button id="unlockHoldButton" type="button">長押しで解除</button>
      </div>
    </div>

    <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
